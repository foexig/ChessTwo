<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess — Local Multiplayer</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Lobby Screen -->
  <div id="lobby" class="screen">
    <div class="lobby-card">
      <h1>♟️ Chess</h1>
      <p class="subtitle">Local Network Multiplayer</p>

      <div class="time-control-section">
        <label class="tc-label">Time Control</label>
        <div class="time-options" id="timeOptions">
          <button class="tc-btn" data-tc="1+0">1 min</button>
          <button class="tc-btn" data-tc="3+0">3 min</button>
          <button class="tc-btn" data-tc="3+2">3+2</button>
          <button class="tc-btn" data-tc="5+0">5 min</button>
          <button class="tc-btn" data-tc="5+3">5+3</button>
          <button class="tc-btn" data-tc="10+0">10 min</button>
          <button class="tc-btn" data-tc="15+10">15+10</button>
          <button class="tc-btn" data-tc="30+0">30 min</button>
          <button class="tc-btn active" data-tc="unlimited">∞ Unlimited</button>
        </div>
      </div>

      <div class="lobby-buttons">
        <button id="btnCreate" class="btn btn-primary">Create New Game</button>
      </div>
      <div class="join-section">
        <input type="text" id="gameIdInput" placeholder="Game Code" maxlength="6" autocomplete="off">
        <button id="btnJoin" class="btn btn-secondary">Join Game</button>
      </div>
      <div id="lobbyMessage" class="lobby-message"></div>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game" class="screen hidden">
    <div class="game-header">
      <div class="game-info">
        <span id="gameCodeDisplay" class="game-code"></span>
        <span id="turnIndicator" class="turn-indicator"></span>
      </div>
      <div class="game-actions">
        <button id="btnResign" class="btn btn-small btn-danger">Resign</button>
        <button id="btnRematch" class="btn btn-small btn-secondary">Request Rematch</button>
        <button id="btnLeave" class="btn btn-small btn-secondary">Leave</button>
      </div>
    </div>

    <div class="game-layout">
      <!-- Board Area -->
      <div class="board-container">
        <div class="player-bar">
          <div id="playerTop" class="player-label">Black</div>
          <div id="clockTop" class="clock-display hidden">--:--</div>
        </div>
        <div id="chessboard" class="chessboard"></div>
        <div class="player-bar">
          <div id="playerBottom" class="player-label">White</div>
          <div id="clockBottom" class="clock-display hidden">--:--</div>
        </div>
      </div>

      <!-- Side Panel -->
      <div class="side-panel">
        <div class="status-panel">
          <h3>Status</h3>
          <div id="gameStatus" class="game-status">Waiting for opponent...</div>
        </div>

        <div class="move-history-panel">
          <h3>Moves</h3>
          <div id="moveHistory" class="move-history"></div>
        </div>

        <div class="chat-panel">
          <h3>Chat</h3>
          <div id="chatMessages" class="chat-messages"></div>
          <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off">
            <button id="btnChatSend" class="btn btn-small btn-primary">Send</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Promotion Dialog -->
    <div id="promotionDialog" class="promotion-dialog hidden">
      <div class="promotion-content">
        <p>Promote to:</p>
        <div class="promotion-options">
          <button data-piece="q" class="promotion-btn"><img src="/img/pieces/wQ.svg" alt="Q"></button>
          <button data-piece="r" class="promotion-btn"><img src="/img/pieces/wR.svg" alt="R"></button>
          <button data-piece="b" class="promotion-btn"><img src="/img/pieces/wB.svg" alt="B"></button>
          <button data-piece="n" class="promotion-btn"><img src="/img/pieces/wN.svg" alt="N"></button>
        </div>
      </div>
    </div>

    <!-- Rematch Request Dialog -->
    <div id="rematchDialog" class="rematch-dialog hidden">
      <div class="rematch-content">
        <h3>Rematch Request</h3>
        <p id="rematchDialogText">Opponent wants a rematch</p>
        <div class="rematch-actions">
          <button id="btnAcceptRematch" class="btn btn-primary">Accept</button>
          <button id="btnDeclineRematch" class="btn btn-secondary">Decline</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Game Code Modal — shown after creating a game -->
  <div id="codeModal" class="code-modal hidden">
    <div class="code-modal-content">
      <h2>Game Created! ♟️</h2>
      <p class="code-hint">Share this code with your opponent:</p>
      <div id="codeDisplayBig" class="code-display-big"></div>
      <p class="code-ip-hint">Opponent also needs this address:<br><span id="serverIpHint"></span></p>
      <div class="code-modal-actions">
        <button id="btnCopyCode" class="btn btn-primary">Copy Code</button>
        <button id="btnCloseModal" class="btn btn-secondary">Start Playing</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/chess-lib.js"></script>
  <script src="/js/chessboard.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
